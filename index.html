<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asylum Escape - Panoramic Horror</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
                "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js",
                "@tensorflow-models/coco-ssd": "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="panorama-view"></div>
        
        <div id="ui-overlay">
            <div id="message-container">
                <p id="message-text"></p>
            </div>
            
            <div id="inventory-panel">
                <h3>Inventory</h3>
                <div id="inventory-items"></div>
            </div>
            
            <div id="controls">
                <button id="hide-btn" class="action-btn">Hide</button>
                <button id="inspect-btn" class="action-btn">Inspect</button>
                <button id="move-btn" class="action-btn">Move</button>
            </div>
            
            <div id="interaction-menu" class="hidden">
                <!-- Dynamically populated based on context -->
            </div>
            
            <div id="loading-screen">
                <div class="spinner"></div>
                <p>Generating asylum...</p>
            </div>
        </div>
    </div>
    
    <script type="module" src="game.js"></script>
